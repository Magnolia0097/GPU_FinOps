# 트레이스 GPU 모델 → 현행 인스턴스 매핑
#
# 목적
#   Alibaba 트레이스는 2020년 데이터로 V100/T4 세대다. (docs/02-data-sources.md)
#   현행 가격 API는 H100/A100 세대 인스턴스의 가격을 준다.
#   두 세대를 잇는 매핑이 필요하며, 이 매핑은 **명시적 가정**이다.
#
# 원칙
#   1. 매핑 근거(rationale)를 반드시 남긴다.
#   2. 성능 환산 계수는 민감도 분석 대상이다.
#   3. 세대 환산 없이 "동일 세대 내 비교"만 하는 시나리오도 함께 산출한다.
#      → 환산 가정에 의존하지 않는 결론을 최소한 하나는 확보하기 위함.
#
# 상태: PLACEHOLDER — Week 1 스키마 검증 후 실제 등장 GPU 모델로 확정할 것

version: 1

# 트레이스에서 관측된 GPU 모델 (README 기준, Week 1에 실측 확인 필요)
observed_gpu_models:
  - V100M32
  - T4
  - K40m      # MISC
  - K80       # MISC
  - M60       # MISC

mappings: {}
# 예시 구조 (값 없음):
#
# V100M32:
#   contemporary_instance: null      # TODO: AWS 인스턴스 타입
#   modern_equivalent: null          # TODO: 현행 세대 대응
#   perf_scaling_factor:
#     value: null
#     source: "TODO: 공개 벤치마크. 워크로드에 따라 크게 달라짐"
#     confidence: low
#     sensitivity: true
#   rationale: "TODO: 왜 이 인스턴스에 대응시켰는가"

# MISC 등급(K40m/K80/M60)은 구세대라 현행 대응이 불명확하다.
# 분석에서 제외할지 별도 처리할지 Week 1 데이터 프로파일링 결과를 보고 결정한다.
misc_handling:
  strategy: null    # TODO: "exclude" | "separate_bucket" | "map_to_lowest_tier"
  rationale: "TODO: MISC 등급의 트레이스 내 비중을 측정한 뒤 결정"
